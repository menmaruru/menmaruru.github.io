<title>Ytube neo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@700&family=Space+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#efefed;--ink:#101010;--sub:#77777a;--card:#f8f8f6;--line:#cfcfcb;--dot:#c4c4c0;--red:#d71921;--mono:"Space Mono","Hiragino Sans",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0b0b0b;--ink:#f2f2f0;--sub:#8a8a8a;--card:#141414;--line:#2c2c2c;--dot:#262626}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.4px);background-size:16px 16px;color:var(--ink);font-family:var(--mono);line-height:1.5;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 40px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{margin:0;font-family:"Doto",var(--mono);font-weight:700;font-size:2rem;letter-spacing:.02em;line-height:1}
.stat{display:flex;align-items:center;gap:8px;font-size:.7rem;letter-spacing:.12em;color:var(--sub)}
.stat i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.stat.on{color:var(--ink)}
.stat.on i{background:var(--red);box-shadow:0 0 8px var(--red)}
form{display:flex;gap:10px;margin-bottom:12px}
input,button{font-family:inherit;-webkit-appearance:none;appearance:none}
input{flex:1;min-width:0;height:52px;padding:0 20px;border:1px solid var(--ink);border-radius:999px;background:var(--card);color:var(--ink);font-size:16px}
input::placeholder{color:var(--sub)}
form button{flex:none;display:grid;place-items:center;width:52px;height:52px;padding:0;border:0;border-radius:50%;background:var(--ink);color:var(--bg);cursor:pointer}
form button:active{background:var(--red);color:#fff}
form button svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.msg{color:var(--red);min-height:1.4em;margin:0 0 10px 20px;font-size:.8rem}
.main{display:grid;grid-template-columns:1fr;gap:18px}
.player{aspect-ratio:16/9;background:#000;border:1px solid var(--ink);border-radius:20px;overflow:hidden}
.player.v{width:min(100%,360px,calc(78vh*9/16));aspect-ratio:9/16;margin:0 auto}
.player iframe{width:100%;height:100%;border:0}
.empty{height:100%;display:grid;place-items:center;padding:16px;text-align:center;color:var(--sub);font-size:.8rem;letter-spacing:.04em;background-color:var(--card);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.4px);background-size:16px 16px}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
li{position:relative;display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:72px;padding:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;cursor:pointer}
li.on{border-color:var(--ink)}
li.on::after{content:"";position:absolute;top:14px;left:14px;width:8px;height:8px;border-radius:50%;background:var(--red)}
li img{width:120px;aspect-ratio:16/9;object-fit:cover;flex-shrink:0;border-radius:10px;filter:grayscale(1) contrast(1.05)}
li.on img{filter:none}
li .del{flex:none;width:44px;height:44px;padding:0;border:1px solid var(--line);border-radius:50%;background:none;color:var(--ink);font-size:18px;line-height:1;cursor:pointer}
.clear{display:block;width:100%;min-height:44px;margin-top:12px;border:1px dashed var(--sub);border-radius:999px;background:none;color:var(--sub);font-size:.78rem;letter-spacing:.12em;cursor:pointer}
.clear[hidden]{display:none}
@media (min-width:900px){
  .wrap{padding:40px 24px 56px}
  h1{font-size:2.6rem}
  .main{grid-template-columns:1fr 300px;gap:28px;align-items:start}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Ytube (5a)</h1>
    <div class="stat" id="stat"><i></i><span id="st">READY</span></div>
  </header>
  <form id="f">
    <input id="u" type="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="URL入力、▶でペースト" aria-label="YouTubeのURL">
    <button aria-label="再生（入力が空ならコピーしたURLを貼り付けて再生）"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.3 4.8h.01M6.3 8.4h.01M6.3 12h.01M6.3 15.6h.01M6.3 19.2h.01M9.9 8.4h.01M9.9 12h.01M9.9 15.6h.01M13.5 8.4h.01M13.5 12h.01M13.5 15.6h.01M17.1 12h.01M20.7 12h.01"/></svg></button>
  </form>
  <div class="msg" id="msg"></div>
  <div class="main">
    <div class="player" id="player"><div class="empty">URLを追加すると、ここで再生できます</div></div>
    <div>
      <ul id="list"></ul>
      <button type="button" class="clear" id="clear" hidden>すべて削除</button>
    </div>
  </div>
</div>
<script>
const KEY="yt-list",MAX=3,RE=/^(s\.)?[\w-]{11}$/;
const vid=k=>k.replace(/^s\./,""),isShort=k=>k.startsWith("s.");
function load(){
  const m=document.cookie.match(/(?:^|; )yt-list=([^;]*)/);
  if(m)return m[1].split(",").filter(x=>RE.test(x)).slice(0,MAX);
  try{return JSON.parse(localStorage.getItem(KEY)||"[]").filter(x=>RE.test(x)).slice(0,MAX)}catch(e){return[]}
}
let items=load();
let cur=items[0]||null;
const $=id=>document.getElementById(id);
const EMPTY='<div class="empty">URLを追加すると、ここで再生できます</div>';
function save(){
  items=items.slice(0,MAX);
  document.cookie=KEY+"="+items.join(",")+"; max-age=31536000; path=/; SameSite=Lax";
  try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}
}
function parseId(s){
  s=s.trim();
  if(/^[\w-]{11}$/.test(s))return s;
  try{
    const u=new URL(s),h=u.hostname.replace("www.","");
    if(h==="youtu.be"||h==="m.youtu.be")return u.pathname.slice(1,12);
    if(h==="youtube.com"||h.endsWith(".youtube.com")){
      if(u.searchParams.get("v"))return u.searchParams.get("v");
      const m=u.pathname.match(/\/(embed|shorts|live|watch|w)\/([\w-]{11})/);
      if(m)return (m[1]==="shorts"?"s.":"")+m[2];
      const p=u.pathname.match(/([\w-]{11})/);
      if(p)return p[1];
    }
  }catch(e){}
  return null;
}
function play(k){
  cur=k;
  $("player").innerHTML=`<iframe src="https://www.youtube.com/embed/${vid(k)}?rel=0&playsinline=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
  render();
}
function render(){
  const ul=$("list");ul.innerHTML="";
  $("clear").hidden=!items.length;
  $("stat").classList.toggle("on",!!cur);
  $("st").textContent=cur?"PLAYING":"READY";
  $("player").classList.toggle("v",!!cur&&isShort(cur));
  items.forEach(k=>{
    const li=document.createElement("li");
    if(k===cur)li.className="on";
    li.innerHTML=`<img src="https://i.ytimg.com/vi/${vid(k)}/mqdefault.jpg" alt=""><button class="del" aria-label="削除">×</button>`;
    li.onclick=()=>play(k);
    li.querySelector(".del").onclick=e=>{
      e.stopPropagation();
      items=items.filter(x=>x!==k);save();
      if(cur===k){cur=items[0]||null;cur?play(cur):($("player").innerHTML=EMPTY,render())}else render();
    };
    ul.appendChild(li);
  });
}
$("f").onsubmit=async e=>{
  e.preventDefault();
  let v=$("u").value.trim(),paste=false;
  if(!v){
    paste=true;
    try{v=(await navigator.clipboard.readText()).trim()}catch(err){
      $("msg").textContent="クリップボードを読み取れませんでした。入力欄に貼り付けてください。";$("u").focus();return}
  }
  const k=parseId(v);
  if(!k){$("msg").textContent=paste?"コピーした内容がYouTubeのURLではありません。":"YouTubeのURLを認識できませんでした。動画のURLをそのまま貼り付けてください。";return}
  $("msg").textContent="";
  items=items.filter(x=>vid(x)!==vid(k));items.unshift(k);save();
  $("u").value="";play(k);
};
$("clear").onclick=()=>{
  if(!confirm("履歴をすべて削除しますか？"))return;
  items=[];cur=null;
  document.cookie=KEY+"=; max-age=0; path=/; SameSite=Lax";
  try{localStorage.removeItem(KEY)}catch(e){}
  $("msg").textContent="";
  $("player").innerHTML=EMPTY;
  render();
};
if(cur)play(cur);else render();
</script>
</body>
</html>
