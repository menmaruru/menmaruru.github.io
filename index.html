.cd:not(.ap):hover{transform:scale(1.22) translateY(-6px);background:#181818;border-radius:8px;box-shadow:0 14px 36px #000e}
.cd:not(.ap):hover .im{border-radius:8px 8px 0 0;box-shadow:none}
.cd:not(.ap):hover .tt{padding:0 10px;margin-top:10px}
.cd:not(.ap) .ab{left:0;right:0;top:100%;bottom:auto;align-items:center;gap:8px;padding:2px 10px 12px;background:#181818;border-radius:0 0 8px 8px;box-shadow:0 14px 36px #000e}
.cd:not(.ap) .ab button{width:34px;height:34px;font-size:13px}}
.lh{padding-top:4px}.lh h1{margin:10px 4% 8px;font-size:clamp(24px,3.4vw,38px);font-weight:800}
.lst{display:flex;gap:10px;overflow-x:auto;padding:6px 4%;scrollbar-width:none}.ls{flex:none;min-width:96px;padding:12px 16px;background:#ffffff12;border-radius:12px}.ls b{display:block;font-size:24px;font-weight:800;line-height:1.2}.ls span{font-size:12px;color:#a3a3a3}
.em2{margin:6px 4% 22px;color:#8e8e93;font-size:14px}
.td{position:relative;margin:8px 4% 14px;border-radius:16px;overflow:hidden;aspect-ratio:21/9;min-height:190px;background:#222}
.td .tdi,.td .tdi img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.td .tdi img{filter:brightness(.6)}
.td::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#000c,#0000 70%);pointer-events:none}
.tdt{position:absolute;z-index:2;left:20px;bottom:18px;right:20px;max-width:560px}
.tdt small{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--ac,#e50914);color:var(--at,#fff);font-size:12px;font-weight:700;letter-spacing:.06em}
.tdt h3{margin:8px 0 12px;font-size:clamp(18px,2.6vw,30px);font-weight:800;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ls2{min-width:130px}.ls2 b small{font-size:13px;margin-left:3px;color:#a3a3a3;font-weight:600}.wk{display:flex;gap:5px;margin-top:8px}.wk i{width:14px;height:14px;border-radius:50%;background:#ffffff1f}.wk i.on{background:var(--ac,#e50914)}.wk i.tdy{box-shadow:0 0 0 2px #fff6}
#gc .gb{width:min(560px,100%);text-align:center}.gx{position:relative}
#gc .gf{position:relative;aspect-ratio:16/9;border-radius:16px;background:#1c1c1e;overflow:hidden;box-shadow:0 0 0 1px #ffffff1f,0 20px 60px #000}
#gc .gf img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#gc .win .gf{box-shadow:0 0 0 3px var(--ac,#e50914),0 0 60px color-mix(in srgb,var(--ac,#e50914) 60%,transparent);animation:gw .5s cubic-bezier(.2,1.4,.4,1)}
#gt{margin:16px 6px 14px;font-size:17px;font-weight:700;min-height:2.6em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#gc .gbt{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}#gc .gbt button:disabled{opacity:.4}
#gbs{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none}#gbs i{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--c);animation:gp .9s ease-out forwards}
@keyframes gw{from{transform:scale(.94)}to{transform:none}}@keyframes gp{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--x),var(--y)) scale(.3);opacity:0}}
.mbar{justify-content:space-between}.mbar .xr{width:44px;padding:0;justify-content:center}.mi{display:none}
.md.mini{inset:auto;width:0;height:0;padding:0;background:none;overflow:visible;pointer-events:none}.md.mini.o{display:block}
.md.mini .bx{pointer-events:auto;position:fixed;left:8px;right:8px;bottom:calc(66px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px;width:auto;max-width:none;margin:0;padding:6px;border-radius:14px;background:#262628;box-shadow:0 8px 30px #000b,0 0 0 1px #ffffff14;overflow:hidden}
.md.mini .mbar,.md.mini .inf{display:none}
.md.mini .pl{position:relative;flex:none;width:112px;border-radius:8px;overflow:hidden}.md.mini .pl::after{content:"";position:absolute;inset:0}
.md.mini .mi{display:flex;flex:1;min-width:0;align-items:center;gap:8px}
.mt{flex:1;min-width:0;font-size:13px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
body:has(.md.mini.o){padding-bottom:calc(150px + env(safe-area-inset-bottom))}
@media (min-width:641px){.md.mini .bx{left:auto;right:20px;bottom:20px;width:360px;flex-direction:column;align-items:stretch;gap:0;padding:0}.md.mini .pl{width:100%;border-radius:0}.md.mini .mi{flex:none;padding:8px 10px}}

/* design polish */
::selection{background:color-mix(in srgb,var(--ac,#e50914) 45%,transparent)}
html{scrollbar-color:#3a3a3c transparent;scrollbar-width:thin}
:focus-visible{outline:2px solid var(--ac,#e50914);outline-offset:2px}
.cd:focus-visible{outline:0}
#ts{background:#2c2c2ef2;color:#fff;border:1px solid #ffffff1a;border-radius:999px;box-shadow:0 8px 28px #000a;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-weight:600;font-size:14px;padding:11px 20px}
.fm input,.fm textarea,.fm select{width:100%;padding:12px 14px;background:#2c2c2e;border:1px solid transparent;border-radius:10px;color:#fff;font:inherit;font-size:16px;box-sizing:border-box;transition:border-color .15s}
.fm input:focus,.fm textarea:focus,.fm select:focus{outline:0;border-color:var(--ac,#e50914)}
.bx.fm{border-radius:18px}
.md.o .bx,.ad.o .bx{animation:pop .24s cubic-bezier(.2,.9,.3,1)}.md.o:not(.mini),.ad.o{animation:bf .2s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}}@keyframes bf{from{opacity:0}}
.im{border-radius:6px}.cd:not(.ap) .im{box-shadow:inset 0 0 0 1px #ffffff12}
.cd{transition:transform .25s cubic-bezier(.2,.7,.2,1)}
.tt{letter-spacing:.005em}
.rw h2,.gh{letter-spacing:.01em}.rw h2{margin-top:22px}
.chip{background:#ffffff14;border-color:#ffffff1f;transition:background .15s}.chip:hover{background:#ffffff26}.chip.on{background:#fff;color:#000;border-color:#fff}
.hi p{display:inline-block;margin:0 0 14px;padding:2px 11px;border:1px solid #ffffff4d;border-radius:999px;background:#0006;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-size:12px;color:#fff}
.ls{border:1px solid #ffffff10}.td{box-shadow:0 0 0 1px #ffffff14,0 12px 30px #0008}
@media (max-width:640px){.rw h2,.gh{font-size:18px}#ts{bottom:calc(84px + env(safe-area-inset-bottom))}#nv a.on svg{filter:drop-shadow(0 0 8px color-mix(in srgb,var(--ac,#e50914) 55%,transparent))}}
